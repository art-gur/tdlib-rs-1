name: CI macOS

on:
  push:
    branches-ignore: [ 'dependabot/**' ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_run:
    workflows: [ CD ]
    types: [ completed ]
    # CD only runs on version tags, so its head_branch is the tag (`v1.6.0`),
    # never `main`. Matching just `main` meant this rerun never fired and CI
    # stayed red on the run that raced the release.
    branches: [ main, 'v*' ]

env:
  GH_TOKEN: ${{ github.token }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  API_HASH: a3406de8d171bb422bb6ddf3bbd800e2
  API_ID: 94575

jobs:
  ci:

    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, 	macos-latest]
        feature: [local-tdlib, download-tdlib, pkg-config, docs, "local-tdlib,static", "download-tdlib,static"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download TDLib
        if:  contains(matrix.feature, 'local-tdlib') || contains(matrix.feature, 'pkg-config')
        run: |
          gh release download --pattern ${{ runner.arch == 'ARM64' && 'tdlib-*-macos-aarch64.zip' || 'tdlib-*-macos-x86_64.zip' }}
          unzip -q *.zip -d .
      - name: Set pkg-config environment variables
        if: matrix.feature == 'pkg-config'
        run: |
          echo "PKG_CONFIG_PATH=$(pwd)/tdlib/lib/pkgconfig" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$(pwd)/tdlib/lib" >> $GITHUB_ENV
      - name: Set local-tdlib environment variables
        if: contains(matrix.feature, 'local-tdlib')
        run: echo "LOCAL_TDLIB_PATH=$(pwd)/tdlib/" >> $GITHUB_ENV
      - name: Run cargo build
        run: cargo build --verbose --features ${{ matrix.feature }}
      - name: Run cargo test
        run: cargo test --verbose --workspace --exclude tdlib-rs -- --nocapture --test-threads=1
      - name: Run cargo clippy
        run: cargo clippy --all-targets --features ${{ matrix.feature }} -- -D warnings
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - name: Run cargo run
        if: matrix.feature != 'docs'
        run: cargo run --package tdlib-rs --example test_ci --features ${{ matrix.feature }}
